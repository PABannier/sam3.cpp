<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sam3-server</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; background: #1e1e2e; color: #cdd6f4; }
#app { display: flex; gap: 12px; padding: 12px; align-items: flex-start; height: 100vh; }
#panel { width: 300px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
#view { flex: 1; min-width: 0; align-self: stretch; display: flex; align-items: center; justify-content: center; overflow: auto; background: #11111b; border-radius: 6px; }
#canvas { border: 1px solid #45475a; border-radius: 6px; max-width: 100%; max-height: 100%; background: #000; cursor: crosshair; }
button, input, select { background: #313244; color: #cdd6f4; border: 1px solid #45475a; border-radius: 4px; padding: 6px 10px; }
button:hover { background: #45475a; }
button.primary { background: #89b4fa; color: #11111b; border: none; font-weight: 600; }
button.primary:hover { background: #b4befe; }
label { font-size: 12px; opacity: .8; }
#status { font-size: 12px; min-height: 40px; word-break: break-word; }
#results { max-height: 300px; overflow-y: auto; font-size: 11px; }
.maskrow { display: flex; gap: 6px; align-items: center; }
.maskrow input { width: 100%; }
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <label>Model</label>
    <select id="model"><option>auto</option></select>
    <label>Image</label>
    <input type="file" id="file" accept="image/*">
    <label>Video</label>
    <div>
      <input type="file" id="vfile" accept="video/*" style="width:100%; box-sizing:border-box;">
      <button id="btn-vid-upload">Upload video</button>
    </div>
    <div>
      <button id="btn-frame-prev">&#9664;</button>
      <input id="frame-idx" type="number" value="0" style="width:70px">
      <button id="btn-frame-next">&#9654;</button>
      <button id="btn-frame-load">Load frame</button>
      <input id="vid-max" type="number" value="5" title="max frames to track" style="width:55px">
      <button id="btn-vid-track">Track (video)</button>
      <button id="btn-vid-cancel" disabled>Cancel track</button>
      <button id="btn-inst-add" title="save current points/box as an instance">+ instance</button>
      <button id="btn-inst-clear" title="clear saved instances">clear instances</button>
    </div>
    <label>Text prompt (detect)</label>
    <input type="text" id="prompt" placeholder="e.g. a dog">
    <div>
      <label>score <input id="score-thr" type="number" step="0.05" min="0" max="1" value="0.5" style="width:55px"></label>
      <label>nms <input id="nms-thr" type="number" step="0.05" min="0" max="1" value="0.1" style="width:55px"></label>
      <label><input type="checkbox" id="chk-boxes"> show boxes</label>
      <label><input type="checkbox" id="chk-cleanup"> cleanup mask</label>
    </div>
    <div>
      <button class="primary" id="btn-segment">Segment (PVS)</button>
      <button id="btn-detect">Detect (PCS)</button>
    </div>
    <div>
      <button id="btn-clear">Clear prompts</button>
      <button id="btn-mask-png">Save mask PNG</button>
      <button id="btn-overlay-png">Save overlay PNG</button>
    </div>
    <label>Tracking</label>
    <div>
      <button id="btn-track-new">New session</button>
      <button id="btn-track-add">Add instance</button>
      <button id="btn-track-frame">Track frame</button>
      <button id="btn-track-reset">Reset</button>
    </div>
    <div id="status">idle — click: +point, right-click: -point, shift+drag: box</div>
    <div id="results"></div>
  </div>
  <div id="view">
    <canvas id="canvas"></canvas>
  </div>
</div>
<script>
window.onerror = function (msg) {
  try { document.getElementById('status').textContent = 'JS ERROR: ' + msg; } catch (e) {}
};
const $ = id => document.getElementById(id);
const canvas = $('canvas'), ctx = canvas.getContext('2d');
let img = null;            // HTMLImageElement
let imageBase64 = null;    // jpeg data url base64 for requests
let points = [], box = null, boxStart = null;
let masks = [], detBoxes = [];
let instances = [];
let trackId = null, trackFrame = 0;
let videoId = null, vidFrame = 0, vframes = {};
let videoJobId = null;

async function refreshModels() {
  try {
    const r = await fetch('/models');
    const j = await r.json();
    const sel = $('model');
    if (sel.options.length === 0 || sel.options.length !== j.models.length + 1) {
      sel.innerHTML = '<option>auto</option>';
      for (const m of j.models) {
        const o = document.createElement('option');
        o.textContent = m.split('/').pop();
        sel.appendChild(o);
      }
    }
  } catch (e) { /* ignore */ }
}
refreshModels();

function setStatus(s) { $('status').textContent = s; }

$('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    img = new Image();
    img.onload = () => {
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      ctx.drawImage(img, 0, 0);
      points = []; box = null; masks = []; detBoxes = [];
      setStatus('image loaded');
    };
    img.src = fr.result;
    imageBase64 = fr.result.split(',')[1];
  };
  fr.readAsDataURL(f);
});

function cvPos(e) {
  const r = canvas.getBoundingClientRect();
  const sx = canvas.width / r.width;
  const sy = canvas.height / r.height;
  return [(e.clientX - r.left) * sx, (e.clientY - r.top) * sy];
}

canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('mousedown', e => {
  const [x, y] = cvPos(e);
  if (e.shiftKey) { boxStart = [x, y]; return; }
  const label = e.button === 2 ? -1 : 1;
  points.push({ x: Math.round(x), y: Math.round(y), label });
  redraw();
});
canvas.addEventListener('mousemove', e => {
  if (!boxStart) return;
  const [x, y] = cvPos(e);
  box = { x0: boxStart[0], y0: boxStart[1], x1: x, y1: y };
  redraw();
});
canvas.addEventListener('mouseup', e => { if (boxStart) boxStart = null; });

function redraw() {
  if (!img) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0);
  for (const m of masks) drawMask(m, 0.45, PALETTE[(m.id || 0) % PALETTE.length]);
  for (const p of points) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = p.label > 0 ? '#55ff55' : '#ff5555';
    ctx.fill();
    ctx.strokeStyle = '#111'; ctx.stroke();
  }
  if (box) {
    ctx.strokeStyle = '#89b4fa'; ctx.lineWidth = 2;
    ctx.strokeRect(Math.min(box.x0, box.x1), Math.min(box.y0, box.y1),
                   Math.abs(box.x1 - box.x0), Math.abs(box.y1 - box.y0));
    ctx.lineWidth = 1;
  }
  if ($('chk-boxes').checked) {
    ctx.font = '12px sans-serif';
    for (let i = 0; i < detBoxes.length; i++) {
      const b = detBoxes[i];
      if (!b || (masks[i] && masks[i].hidden)) continue;
      ctx.strokeStyle = '#ff8888'; ctx.lineWidth = 2;
      ctx.strokeRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);
      ctx.lineWidth = 1;
      ctx.fillStyle = '#ff8888';
      ctx.fillText('#' + b.id + ' ' + b.score.toFixed(2), b.x0, Math.max(b.y0 - 4, 12));
    }
  }
}

const PALETTE = ['#ff5555', '#55ff55', '#5588ff', '#ffff55', '#ff55ff', '#55ffff', '#ff9955', '#9955ff'];

function maskCanvas(m, color) {
  const c = document.createElement('canvas');
  c.width = m.width; c.height = m.height;
  const cx = c.getContext('2d');
  const im = cx.createImageData(m.width, m.height);
  const tmp = document.createElement('canvas');
  tmp.width = 1; tmp.height = 1;
  const tcx = tmp.getContext('2d');
  tcx.fillStyle = color || '#ff5555';
  tcx.fillRect(0, 0, 1, 1);
  const px = tcx.getImageData(0, 0, 1, 1).data;
  for (let i = 0; i < m.data.length; i++) {
    im.data[i * 4] = px[0];
    im.data[i * 4 + 1] = px[1];
    im.data[i * 4 + 2] = px[2];
    im.data[i * 4 + 3] = m.data[i];
  }
  cx.putImageData(im, 0, 0);
  return c;
}

function drawMask(m, alpha, color) {
  const c = maskCanvas(m, color);
  ctx.globalAlpha = alpha;
  ctx.drawImage(c, 0, 0, canvas.width, canvas.height);
  ctx.globalAlpha = 1;
}

function decodeMasks(list) {
  const out = [];
  for (const m of list) {
    const bin = atob(m.mask_base64);
    const data = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) data[i] = bin.charCodeAt(i);
    out.push({ width: m.width, height: m.height, data, iou: m.iou_score, obj: m.obj_score, id: m.instance_id });
  }
  return out;
}

function decodeDets(list) {
  const out = [];
  for (const d of list) {
    const m = decodeMasks([d.mask])[0];
    m.box = d.box;
    m.score = d.score;
    out.push(m);
  }
  return out;
}

function setMasks(list) {
  masks = decodeMasks(list);
  detBoxes = [];
  redraw();
  return masks;
}

function applyFrameMasks(list) {
  masks = list || [];
  detBoxes = masks.filter(m => m.box).map(m => ({
    x0: m.box.x0, y0: m.box.y0, x1: m.box.x1, y1: m.box.y1, id: m.id, score: m.score }));
}

function setDets(list) {
  applyFrameMasks(decodeDets(list));
  redraw();
  return masks;
}

function showResults(label, dets, timeMs) {
  const div = $('results');
  div.innerHTML = '';
  const h = document.createElement('div');
  h.textContent = label + (timeMs ? ' (' + timeMs.toFixed(0) + ' ms)' : '');
  div.appendChild(h);
  for (const d of dets) {
    const row = document.createElement('div');
    row.className = 'maskrow';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = true;
    cb.onchange = () => { d.hidden = !cb.checked; redraw(); };
    row.appendChild(cb);
    const s = document.createElement('span');
    s.textContent = '#' + (d.id === undefined || d.id === null ? '' : d.id) + ' iou=' + ((d.iou === undefined ? 0 : d.iou)).toFixed(3) + ' obj=' + ((d.obj === undefined ? 0 : d.obj)).toFixed(3);
    row.appendChild(s);
    div.appendChild(row);
  }
}

async function segment() {
  if (!img) { setStatus('load an image first'); return; }
  setStatus('segmenting...');
  const body = { image_base64: imageBase64, points, multimask: false };
  if (box) body.box = box;
  if ($('chk-cleanup').checked) body.cleanup = true;
  try {
    const r = await fetch('/segment', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (j.error) { setStatus('error: ' + j.error); return; }
    const mm = setMasks(j.masks);
    showResults('segment', mm.map(m => ({ id: m.id, iou: m.iou, obj: m.obj, hidden: false })), j.time_ms);
    setStatus('done');
  } catch (e) { setStatus('request failed: ' + e); }
}

async function detect() {
  if (!img) { setStatus('load an image first'); return; }
  const p = $('prompt').value;
  if (!p) { setStatus('enter a text prompt'); return; }
  setStatus('detecting...');
  const body = { image_base64: imageBase64, text_prompt: p };
  const st = parseFloat($('score-thr').value);
  const nt = parseFloat($('nms-thr').value);
  if (!isNaN(st)) body.score_threshold = st;
  if (!isNaN(nt)) body.nms_threshold = nt;
  if ($('chk-cleanup').checked) body.cleanup = true;
  try {
    const r = await fetch('/detect', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (j.error) { setStatus('error: ' + j.error); return; }
    const mm = setDets(j.detections);
    showResults('detect "' + p + '"', mm.map(m => ({ id: m.id, iou: m.iou, obj: m.obj, hidden: false })), j.time_ms);
    setStatus('done');
  } catch (e) { setStatus('request failed: ' + e); }
}

async function trackNew() {
  try {
    const r = await fetch('/track/new', { method: 'POST' });
    const j = await r.json();
    trackId = j.id; trackFrame = 0;
    setStatus('tracking session ' + trackId);
  } catch (e) { setStatus('request failed: ' + e); }
}

async function trackAdd() {
  if (!trackId || !img) { setStatus('create session and load image first'); return; }
  const body = { id: trackId, image_base64: imageBase64, points };
  if (box) body.box = box;
  try {
    const r = await fetch('/track/instances', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json();
    setStatus('added instance ' + (j.instance_id !== undefined ? j.instance_id : (j.error ? j.error : '?')));
  } catch (e) { setStatus('request failed: ' + e); }
}

async function sendTrackFrame() {
  if (!trackId || !img) { setStatus('create session and load image first'); return; }
  setStatus('tracking frame...');
  try {
    const r = await fetch('/track/frame', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: trackId, image_base64: imageBase64 }) });
    const j = await r.json();
    if (j.error) { setStatus('error: ' + j.error); return; }
    trackFrame = j.frame_index;
    const mm = setDets(j.detections);
    showResults('track frame ' + trackFrame, mm.map(m => ({ id: m.id, iou: m.iou, obj: m.obj, hidden: false })), j.time_ms);
    setStatus('done');
  } catch (e) { setStatus('request failed: ' + e); }
}

async function trackReset() {
  if (!trackId) return;
  try { await fetch('/track/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: trackId }) }); } catch (e) {}
  trackId = null; setStatus('session reset');
}

async function uploadVideo() {
  const f = $('vfile').files[0];
  if (!f) { setStatus('choose a video file first'); return; }
  setStatus('uploading video...');
  try {
    const fd = new FormData();
    fd.append('file', f);
    const r = await fetch('/video/upload', { method: 'POST', body: fd });
    const j = await r.json();
    if (j.error) { setStatus('error: ' + j.error); return; }
    videoId = j.video_id; vidFrame = 0; vframes = {};
    setStatus('video ' + videoId + ' uploaded, ' + j.n_frames + ' frames');
    await loadVideoFrame(0);
  } catch (e) { setStatus('request failed: ' + e); }
}

async function loadVideoFrame(i) {
  if (!videoId) { setStatus('upload a video first'); return; }
  try {
    const r = await fetch('/video/frame?video_id=' + videoId + '&frame=' + i);
    if (!r.ok) { setStatus('frame ' + i + ' failed: ' + r.status); return; }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const im = new Image();
    im.onload = () => {
      img = im;
      canvas.width = im.naturalWidth;
      canvas.height = im.naturalHeight;
      vidFrame = i; $('frame-idx').value = i;
      const fm = (vframes[i] || {}).masks;
      applyFrameMasks(fm || []);
      redraw();
    };
    im.src = url;
  } catch (e) { setStatus('request failed: ' + e); }
}

async function trackVideo() {
  if (!videoId) { setStatus('upload a video first'); return; }
  const body = { video_id: videoId };
  if (instances.length > 0) {
    body.instances = instances;
  } else {
    body.points = points;
    if (box) body.box = box;
  }
  const tp = $('prompt').value;
  if (tp) body.text_prompt = tp;
  const mx = parseInt($('vid-max').value, 10);
  if (mx > 0) body.max_frames = mx;
  const st = parseFloat($('score-thr').value);
  const nt = parseFloat($('nms-thr').value);
  if (!isNaN(st)) body.score_threshold = st;
  if (!isNaN(nt)) body.nms_threshold = nt;
  setStatus('starting video track job...');
  $('btn-vid-track').disabled = true;
  $('btn-vid-cancel').disabled = false;
  try {
    const r = await fetch('/video/track', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (j.error) { setStatus('error: ' + j.error); return; }
    videoJobId = j.job_id;
    for (;;) {
      await new Promise(res => setTimeout(res, 2000));
      const pr = await fetch('/job/' + videoJobId);
      const pj = await pr.json();
      if (pj.status === 'running') {
        const p = pj.progress || {};
        setStatus('tracking video... ' + p.frames_done + '/' + p.n_frames + ' frames');
        continue;
      }
      if (pj.status === 'error') { setStatus('error: ' + (pj.error || 'job failed')); break; }
      if (pj.status === 'cancelled') { setStatus('cancelled'); break; }
      const jres = pj.result;
      vframes = {};
      for (const f of jres.frames) {
        vframes[f.index] = { masks: decodeDets(f.detections) };
      }
      const fm = (vframes[vidFrame] || {}).masks;
      applyFrameMasks(fm || []);
      const idxs = Object.keys(vframes);
      const f0 = idxs.length > 0 ? vframes[idxs[0]].masks : [];
      showResults('video track', f0.map(m => ({ id: m.id, iou: m.iou, obj: m.obj, hidden: false })), jres.time_ms);
      setStatus('tracked ' + idxs.length + ' frames; use Prev/Next');
      redraw();
      break;
    }
  } catch (e) { setStatus('request failed: ' + e); }
  $('btn-vid-track').disabled = false;
  $('btn-vid-cancel').disabled = true;
  videoJobId = null;
}

async function cancelVideoTrack() {
  if (!videoJobId) return;
  setStatus('cancelling video track...');
  try { await fetch('/job/' + videoJobId + '/cancel', { method: 'POST' }); } catch (e) {}
}

function instAdd() {
  if (points.length === 0 && !box) { setStatus('click points or drag a box first, then + instance'); return; }
  instances.push({ points: points.slice(), box: box || undefined });
  points = []; box = null;
  setStatus('instance ' + instances.length + ' saved (' + (instances[instances.length - 1].points ? instances[instances.length - 1].points.length + ' pts' : 'box') + '); add more or press Track');
  redraw();
}

function instClear() {
  instances = [];
  setStatus('instances cleared');
}

function saveComposite(bg) {
  if (!img) return;
  const c = document.createElement('canvas');
  c.width = canvas.width; c.height = canvas.height;
  const cx = c.getContext('2d');
  if (bg) cx.drawImage(img, 0, 0);
  for (const m of masks) {
    if (m.hidden) continue;
    const mc = maskCanvas(m, PALETTE[(m.id || 0) % PALETTE.length]);
    cx.globalAlpha = bg ? 0.5 : 1;
    cx.drawImage(mc, 0, 0, c.width, c.height);
    cx.globalAlpha = 1;
  }
  const a = document.createElement('a');
  a.href = c.toDataURL('image/png');
  a.download = 'mask.png';
  a.click();
}

$('btn-segment').onclick = segment;
$('btn-detect').onclick = detect;
$('btn-clear').onclick = () => { points = []; box = null; masks = []; detBoxes = []; redraw(); };
$('chk-boxes').onchange = () => redraw();
$('btn-mask-png').onclick = () => saveComposite(false);
$('btn-overlay-png').onclick = () => saveComposite(true);
$('btn-track-new').onclick = trackNew;
$('btn-track-add').onclick = trackAdd;
$('btn-track-frame').onclick = sendTrackFrame;
$('btn-track-reset').onclick = trackReset;
$('btn-vid-upload').onclick = uploadVideo;
$('btn-frame-prev').onclick = () => loadVideoFrame(Math.max(0, vidFrame - 1));
$('btn-frame-next').onclick = () => loadVideoFrame(vidFrame + 1);
$('btn-frame-load').onclick = () => loadVideoFrame(parseInt($('frame-idx').value, 10) || 0);
$('btn-vid-track').onclick = trackVideo;
$('btn-vid-cancel').onclick = cancelVideoTrack;
$('btn-inst-add').onclick = instAdd;
$('btn-inst-clear').onclick = instClear;
</script>
</body>
</html>
